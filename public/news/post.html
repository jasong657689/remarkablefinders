<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remarkable Finders Article</title><meta name="description" content="Read a Remarkable Finders reseller article."><style>*{box-sizing:border-box}body{margin:0;background:#0a0e17;color:#fff;font-family:Arial,system-ui,sans-serif;line-height:1.7}.wrap{max-width:920px;margin:auto;padding:34px 24px 70px}a{color:#60a5fa}.back{display:inline-block;margin-bottom:30px}.article{background:#0e1420;border:1px solid #253352;border-radius:18px;padding:34px}.tag{display:inline-flex;color:#93c5fd;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);border-radius:99px;padding:4px 9px;text-transform:uppercase;font-weight:900;font-size:11px;margin-bottom:14px}h1{font-size:clamp(38px,7vw,68px);line-height:1;margin:0 0 18px}.lead{font-size:18px;color:#94a3b8}.content{margin-top:28px}.content h2{font-size:30px;margin:30px 0 10px}.content p{color:#cbd5e1;margin:0 0 18px}.content ul{color:#cbd5e1}.state{padding:40px;background:#0e1420;border:1px solid #253352;border-radius:14px;color:#94a3b8}.cta{margin-top:32px;background:#101b35;border:1px solid #253352;border-radius:16px;padding:24px}.btn{display:inline-block;margin-top:10px;background:#3b82f6;color:#fff;text-decoration:none;padding:12px 16px;border-radius:10px;font-weight:900}</style></head><body><div class="wrap"><a class="back" href="/news/">← Back to Resource Center</a><div id="root"><div class="state">Loading article...</div></div></div><script>
const API='https://resellersproappprivate-production.up.railway.app/api/public/blog/post';
function e(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function f(t){return String(t||'').split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean).map(b=>{if(/^#\s+/.test(b))return '';if(/^##\s+/.test(b))return '<h2>'+e(b.replace(/^##\s+/,''))+'</h2>';if(/^[-*]\s+/m.test(b))return '<ul>'+b.split(/\n/).filter(Boolean).map(x=>'<li>'+e(x.replace(/^[-*]\s+/,''))+'</li>').join('')+'</ul>';if(b.length<90&&!/[.!?]$/.test(b))return '<h2>'+e(b)+'</h2>';return '<p>'+e(b).replace(/\n/g,'<br>')+'</p>'}).join('')}
async function load(){const root=document.getElementById('root');const slug=new URLSearchParams(location.search).get('slug')||'';if(!slug){root.innerHTML='<div class="state">Article not found.</div>';return}try{const r=await fetch(API+'?slug='+encodeURIComponent(slug),{cache:'no-store'});if(r.status===404){root.innerHTML='<div class="state">Article not published to Remarkable Finders.</div>';return}if(!r.ok)throw new Error('Article feed returned '+r.status);const payload=await r.json();const p=payload&&payload.post;if(!p){root.innerHTML='<div class="state">Article not published to Remarkable Finders.</div>';return}document.title=(p.seo_title||p.title)+' — Remarkable Finders';const md=document.querySelector('meta[name="description"]');if(md)md.setAttribute('content',p.seo_description||p.excerpt||p.title);root.innerHTML='<article class="article"><div class="tag">'+e(p.category||'News')+'</div><h1>'+e(p.title)+'</h1>'+(p.excerpt?'<p class="lead">'+e(p.excerpt)+'</p>':'')+'<div class="content">'+f(p.content||'')+'</div><div class="cta"><strong>Remarkable Finders is powered by Reseller\'s Pro.</strong><p style="color:#94a3b8;margin-bottom:0">Track inventory health, profit, expenses, and reseller analytics in one system.</p><a class="btn" href="https://resellerspro.com/">Learn About Reseller\'s Pro →</a></div></article>'}catch(err){root.innerHTML='<div class="state">Could not load article right now.</div>'}}
load();
</script></body></html>
